[package]
name = "cuttings-import-mymind"
description = "Offline importer for mymind exports into a Cuttings library."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
cuttings-core = { path = "../core" }
sha2 = "0.10"
url = "2"

[dev-dependencies]
tempfile = "3"
