[package]
name = "cuttings-native-host"
description = "Native messaging host binary for the Cuttings browser extension."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "cuttings-native-host"
path = "src/main.rs"

[dependencies]
cuttings-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
