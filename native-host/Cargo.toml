[package]
name = "native-host"
description = "Native messaging host binary for the read-later browser extension."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "native-host"
path = "src/main.rs"

[dependencies]
read-later-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
