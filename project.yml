name: ReadLater
options:
  bundleIdPrefix: com.readlater
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Markdown:
    # Apple's swift-markdown publishes no semver tags; the documented integration
    # is the main branch. Pin to a specific revision here for reproducible builds.
    url: https://github.com/apple/swift-markdown.git
    branch: main

targets:
  ReadLater:
    type: application
    platform: macOS
    sources:
      - Sources/ReadLater
      - path: GeneratedBindings
        optional: true   # populated by `make bindings`
    dependencies:
      - framework: Frameworks/ReadLaterCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - package: Markdown
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.readlater.app
        PRODUCT_NAME: ReadLater
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/ReadLater/App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/GeneratedBindings
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/GeneratedBindings/read_later_coreFFI.modulemap
    entitlements:
      path: Sources/ReadLater/App/ReadLater.entitlements
    preBuildScripts:
      - name: Build and copy native-host
        script: |
          set -e
          # Xcode runs build phases with a sanitized PATH that omits ~/.cargo/bin,
          # so make cargo discoverable before invoking it.
          source "$HOME/.cargo/env" 2>/dev/null || export PATH="$HOME/.cargo/bin:$PATH"
          CORE="${SRCROOT}/../read-later-core"
          cargo build --release --manifest-path "${CORE}/Cargo.toml" --bin native-host
          SRC="${CORE}/target/release/native-host"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/native-host"
          cp "${SRC}" "${DST}"
          chmod +x "${DST}"
        inputFiles:
          - $(SRCROOT)/../read-later-core/native-host/src/main.rs
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/native-host
