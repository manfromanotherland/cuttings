name: ReadControl
options:
  bundleIdPrefix: app.readcontrol
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Markdown:
    url: https://github.com/apple/swift-markdown.git
    exactVersion: "0.8.0"

targets:
  ReadControl:
    type: application
    platform: macOS
    sources:
      - Sources/ReadControl
      - path: GeneratedBindings
        optional: true   # populated by `make bindings`
    dependencies:
      - framework: Frameworks/ReadControlCore.xcframework
        embed: false
      - sdk: SystemConfiguration.framework
      - package: Markdown
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.readcontrol.app
        PRODUCT_NAME: ReadControl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/ReadControl/App/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        HEADER_SEARCH_PATHS: $(SRCROOT)/GeneratedBindings
        OTHER_SWIFT_FLAGS: -Xcc -fmodule-map-file=$(SRCROOT)/GeneratedBindings/readcontrol_coreFFI.modulemap
    entitlements:
      path: Sources/ReadControl/App/ReadControl.entitlements
    preBuildScripts:
      - name: Build and copy native-host
        script: |
          set -e
          # Xcode runs build phases with a sanitized PATH that omits ~/.cargo/bin,
          # so make cargo discoverable before invoking it.
          source "$HOME/.cargo/env" 2>/dev/null || export PATH="$HOME/.cargo/bin:$PATH"
          CORE="${SRCROOT}/../readcontrol-core"
          cargo build --release --manifest-path "${CORE}/Cargo.toml" --bin native-host
          SRC="${CORE}/target/release/native-host"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/native-host"
          cp "${SRC}" "${DST}"
          chmod +x "${DST}"
        inputFiles:
          - $(SRCROOT)/../readcontrol-core/native-host/src/main.rs
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/MacOS/native-host

  # XCUITest end-to-end suite. Drives the real app as a separate process, and is
  # dependency-free (only Xcode + the macOS SDK). The app stays on Swift 6; this
  # target uses 5.0 to avoid strict-concurrency friction in XCTest code.
  ReadControlUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/ReadControlUITests
      # Shared with the app target (it also lives under Sources/ReadControl/) so
      # tests and app compile the same accessibility identifiers.
      - path: Sources/ReadControl/AccessibilityID.swift
    dependencies:
      - target: ReadControl
    settings:
      base:
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: app.readcontrol.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ReadControl

# A shared scheme so `xcodebuild -scheme ReadControl` works from the command line
# and CI. Without this, xcodegen emits no scheme and only Xcode.app auto-creates
# a throwaway one under xcuserdata (not committed, wiped by `make clean`).
schemes:
  ReadControl:
    build:
      targets:
        ReadControl: all
    # Serial: UI tests steal keyboard focus, so parallel runs are flaky.
    # Per-test temp libraries keep future sharding open.
    test:
      config: Debug
      targets:
        - name: ReadControlUITests
          parallelizable: false
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
